<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>

    <link rel="stylesheet" href="../style.css" />
</head>

<body>
    <button id="back_button">Back</button>
    <!-- link to open profile -->
    <div class="profile-container">
        <h1>
            Welcome to your profile:
            <a href="#" id="user_name">....</a>
        </h1>
        <!-- all friends page -->
        <div class="profile-options">
            <div class="profile-card" id="friends">
                <a href="#" id="friends_link">All Friends</a>
            </div>
            <!-- all posts page -->
            <div class="profile-card" id="posts">
                <a href="#" id="posts_link">All Posts</a>
            </div>
            <!-- creating the post -->
            <div class="profile-card" id="create_post">
                <a href="#" id="create_post_link">Create Post</a>
            </div>
        </div>
    </div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="profile.js"></script>
</body>

</html>
